services:
  app:
    build:
      context: ./docker/php
      dockerfile: dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: backend_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres
    networks:
      - backend-network
  nginx:
    image: nginx:latest
    container_name: backend_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-network

  postgres:
    image: postgres:16.8
    container_name: backend_postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backend_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  adminer:
    image: adminer:latest
    container_name: backend_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - backend-network
  composer:
    build:
      context: ./docker/php
      dockerfile: dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: backend_composer
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: bash -c "composer install"
    entrypoint: ["composer"]
    networks:
      - backend-network

networks:
  backend-network:

volumes:
  postgres_data:
